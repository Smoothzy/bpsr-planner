<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Raid Finder - BPSR Planner</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dark-mode.css">
    <style>
        .raid-finder-controls {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 2px solid var(--border-color);
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .control-group select,
        .control-group input {
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            font-size: 1em;
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .raid-results {
            display: grid;
            gap: 20px;
        }

        .time-slot-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 10px var(--shadow);
            border-left: 5px solid var(--accent-primary);
            transition: all 0.3s;
        }

        .time-slot-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px var(--shadow-hover);
        }

        .time-slot-card.excellent {
            border-left-color: #28a745;
        }

        .time-slot-card.good {
            border-left-color: var(--accent-primary);
        }

        .time-slot-card.fair {
            border-left-color: #ffc107;
        }

        .time-slot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .time-slot-time {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--text-primary);
        }

        .time-slot-day {
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 1.2em;
        }

        .player-count-badge {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .player-item {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .player-item-name {
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .player-item-details {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        .class-composition {
            margin-top: 15px;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .class-composition-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .class-bars {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .class-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .class-bar-label {
            min-width: 120px;
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .class-bar-fill {
            flex: 1;
            height: 20px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .class-bar-progress {
            height: 100%;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            transition: width 0.3s;
        }

        .class-bar-count {
            min-width: 30px;
            text-align: right;
            font-weight: bold;
            color: var(--text-primary);
        }

        .avg-gearscore {
            display: inline-block;
            background: #ffc107;
            color: #000;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 600;
            margin-left: 10px;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 1.2em;
        }

        .timeline-view {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: 80px repeat(24, 1fr);
            gap: 1px;
            background: var(--border-color);
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .timeline-header {
            background: var(--accent-primary);
            color: white;
            padding: 8px 4px;
            text-align: center;
            font-weight: 600;
            font-size: 0.75em;
        }

        .timeline-day {
            background: var(--bg-tertiary);
            padding: 8px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            font-size: 0.85em;
        }

        .timeline-cell {
            background: var(--card-bg);
            color: var(--text-primary);
            padding: 8px 4px;
            text-align: center;
            font-size: 0.75em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timeline-cell:hover {
            background: var(--bg-tertiary);
            transform: scale(1.05);
        }

        .timeline-cell.count-0 {
            background: var(--card-bg);
            color: var(--text-primary);
            padding: 5px;
            text-align: center;
            font-size: 0.75em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timeline-cell:hover {
            background: #e3f2fd;
        }

        .timeline-cell.count-1 {
            background: #fff3cd;
            color: #856404;
        }

        .timeline-cell.count-2 {
            background: #d4edda;
            color: #155724;
        }

        .timeline-cell.count-3 {
            background: #cfe2ff;
            color: #084298;
        }

        .timeline-cell.count-4plus {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .view-toggle button {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-toggle button.active {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: white;
            border-color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-link {
            padding: 10px 20px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid var(--border-color);
        }

        .nav-link:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle Light Mode">☀️</button>
    
    <div class="container">
        <header>
            <h1>🔍 Advanced Raid Time Finder</h1>
            <p class="subtitle">Find the perfect time for your raid party</p>
            <button class="btn-primary" onclick="showTimezonePopup()" style="margin-top: 10px;">🌍 Timezone Settings</button>
        </header>

        <div class="nav-links">
            <a href="index.html" class="nav-link">← Back to Planner</a>
            <a href="players-overview.html" class="nav-link">👥 Players Overview</a>
        </div>

        <div class="raid-finder-controls">
            <h2 style="margin-bottom: 20px;">🎯 Search Criteria</h2>
            <div class="control-grid">
                <div class="control-group">
                    <label for="minPlayers">Minimum Players:</label>
                    <input type="number" id="minPlayers" value="2" min="1" max="20">
                </div>
                <div class="control-group">
                    <label for="filterDay">Specific Day:</label>
                    <select id="filterDay">
                        <option value="">All Days</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="minGearScore">Min Avg Gear Score:</label>
                    <input type="number" id="minGearScore" value="0" min="0">
                </div>
                <div class="control-group">
                    <label for="timeRange">Time Range:</label>
                    <select id="timeRange">
                        <option value="all">All Day</option>
                        <option value="morning">Morning (6-12)</option>
                        <option value="afternoon">Afternoon (12-18)</option>
                        <option value="evening">Evening (18-24)</option>
                        <option value="night">Night (0-6)</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" onclick="findRaidTimes()">🔍 Find Raid Times</button>
                <button class="btn-secondary" onclick="resetFilters()">Clear Filters</button>
            </div>
        </div>

        <div class="view-toggle">
            <button class="active" onclick="setView('list')">📋 List View</button>
            <button onclick="setView('timeline')">📅 Timeline View</button>
        </div>

        <div id="listView" class="raid-results"></div>
        <div id="timelineView" class="timeline-view" style="display: none;"></div>
    </div>

    <script>
        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const STORAGE_KEY = 'bpsr_players';
        const API_URL = 'https://web-production-af38.up.railway.app'; // Railway backend server
        let selectedTimezone = 'auto';
        let currentView = 'list';
        let playersCache = {}; // In-memory cache

        function loadPlayers() {
            console.log('Loading players data from cache:', playersCache);
            return playersCache || {};
        }
        
        async function loadFromServer() {
            try {
                const response = await fetch(`${API_URL}/api/players`);
                if (!response.ok) {
                    throw new Error(`Failed to load: ${response.status}`);
                }
                const players = await response.json();
                playersCache = players;
                console.log('Loaded players from server:', players);
                findRaidTimes();
            } catch (error) {
                console.error('Error loading from server:', error);
                alert('Could not load player data from server. Please refresh the page.');
            }
        }

        function isSummerTime() {
            const now = new Date();
            const month = now.getMonth();
            return month >= 3 && month <= 9;
        }

        function getLocalHourFromServerHour(serverHour) {
            // Use current date for DST-aware conversion
            const now = new Date();
            const utcHour = (serverHour + 7) % 24;

            // Create a UTC instant for the given server-hour on the current date
            const utcDate = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), utcHour, 0, 0));

            // For auto (browser local timezone) and specific timezones use toLocaleString
            // with explicit 24-hour format to avoid locale differences
            try {
                const localHourStr = utcDate.toLocaleString('en-US', {
                    timeZone: selectedTimezone === 'auto' ? Intl.DateTimeFormat().resolvedOptions().timeZone : selectedTimezone,
                    hour: 'numeric',
                    hour12: false
                });
                const parsed = parseInt(localHourStr, 10);
                // Ensure hour is in 0-23 range
                return ((isNaN(parsed) ? utcDate.getHours() : parsed) + 24) % 24;
            } catch (e) {
                // Fallback: use local machine conversion
                return utcDate.getHours();
            }
        }

        function formatLocalHour(hour) {
            return hour.toString().padStart(2, '0') + ':00';
        }

        function formatServerHour(hour) {
            return hour.toString().padStart(2, '0') + ':00';
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-toggle button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            if (view === 'list') {
                document.getElementById('listView').style.display = 'grid';
                document.getElementById('timelineView').style.display = 'none';
            } else {
                document.getElementById('listView').style.display = 'none';
                document.getElementById('timelineView').style.display = 'block';
                renderTimelineView();
            }
        }

        function findRaidTimes() {
            const players = loadPlayers();
            const playerNames = Object.keys(players);
            
            console.log('Finding raid times for', playerNames.length, 'players');
            
            if (playerNames.length === 0) {
                document.getElementById('listView').innerHTML = `
                    <div class="no-results">
                        <h2 style="margin-bottom: 15px;">😞 No Players Registered</h2>
                        <p style="margin-bottom: 20px;">Add players in the main planner to start finding raid times!</p>
                        <a href="index.html" style="display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%); color: white; text-decoration: none; border-radius: 5px; font-weight: 600;">
                            Go to Main Planner →
                        </a>
                    </div>
                `;
                return;
            }

            const minPlayers = parseInt(document.getElementById('minPlayers').value) || 2;
            const filterDay = document.getElementById('filterDay').value;
            const minGearScore = parseInt(document.getElementById('minGearScore').value) || 0;
            const timeRange = document.getElementById('timeRange').value;

            // Count availability for each time slot
            const timeSlotCounts = {};
            
            DAYS.forEach(day => {
                if (filterDay && day !== filterDay) return;
                
                timeSlotCounts[day] = {};
                for (let hour = 0; hour < 24; hour++) {
                    timeSlotCounts[day][hour] = {
                        count: 0,
                        players: [],
                        classes: {},
                        totalGearScore: 0
                    };
                }
            });

            // Count players available at each slot
            playerNames.forEach(name => {
                const player = players[name];
                Object.keys(player.availability).forEach(day => {
                    if (!timeSlotCounts[day]) return;
                    
                    player.availability[day].forEach(serverHour => {
                        const slot = timeSlotCounts[day][serverHour];
                        slot.count++;
                        slot.players.push(player);
                        slot.classes[player.class] = (slot.classes[player.class] || 0) + 1;
                        slot.totalGearScore += player.gearScore;
                    });
                });
            });

            // Filter and collect best times
            const bestTimes = [];
            Object.keys(timeSlotCounts).forEach(day => {
                Object.keys(timeSlotCounts[day]).forEach(serverHour => {
                    const hour = parseInt(serverHour);
                    const slot = timeSlotCounts[day][hour];
                    
                    if (slot.count < minPlayers) return;
                    
                    const avgGearScore = slot.totalGearScore / slot.count;
                    if (avgGearScore < minGearScore) return;

                    // Time range filter
                    const localHour = getLocalHourFromServerHour(hour);
                    if (timeRange === 'morning' && (localHour < 6 || localHour >= 12)) return;
                    if (timeRange === 'afternoon' && (localHour < 12 || localHour >= 18)) return;
                    if (timeRange === 'evening' && (localHour < 18 || localHour >= 24)) return;
                    if (timeRange === 'night' && localHour >= 6) return;

                    bestTimes.push({
                        day,
                        serverHour: hour,
                        localHour,
                        count: slot.count,
                        players: slot.players,
                        classes: slot.classes,
                        avgGearScore: Math.round(avgGearScore)
                    });
                });
            });

            // Sort by player count and gear score
            bestTimes.sort((a, b) => {
                if (b.count !== a.count) return b.count - a.count;
                return b.avgGearScore - a.avgGearScore;
            });

            renderRaidTimes(bestTimes);
        }

        function renderRaidTimes(times) {
            const container = document.getElementById('listView');
            
            if (times.length === 0) {
                container.innerHTML = '<div class="no-results">😞 No time slots found matching your criteria.<br>Try adjusting the filters!</div>';
                return;
            }

            container.innerHTML = '';

            times.forEach(time => {
                const quality = time.count >= 6 ? 'excellent' : time.count >= 4 ? 'good' : 'fair';
                
                const card = document.createElement('div');
                card.className = `time-slot-card ${quality}`;
                
                // Build class composition
                let classCompositionHTML = '<div class="class-composition">';
                classCompositionHTML += '<div class="class-composition-title">Party Composition:</div>';
                classCompositionHTML += '<div class="class-bars">';
                
                const totalPlayers = time.count;
                Object.keys(time.classes).forEach(className => {
                    const count = time.classes[className];
                    const percentage = (count / totalPlayers) * 100;
                    classCompositionHTML += `
                        <div class="class-bar">
                            <div class="class-bar-label">${className}</div>
                            <div class="class-bar-fill">
                                <div class="class-bar-progress" style="width: ${percentage}%"></div>
                            </div>
                            <div class="class-bar-count">${count}</div>
                        </div>
                    `;
                });
                classCompositionHTML += '</div></div>';

                // Build players list
                let playersHTML = '<div class="players-grid">';
                time.players.forEach(player => {
                    playersHTML += `
                        <div class="player-item">
                            <div class="player-item-name">${player.name}</div>
                            <div class="player-item-details">
                                ${player.class}<br>
                                GS: ${player.gearScore}
                            </div>
                        </div>
                    `;
                });
                playersHTML += '</div>';

                card.innerHTML = `
                    <div class="time-slot-header">
                        <div>
                            <div class="time-slot-day">${time.day}</div>
                            <div class="time-slot-time">
                                ${formatLocalHour(time.localHour)}
                                <span style="font-size: 0.6em; color: #666;">(${formatServerHour(time.serverHour)} ST)</span>
                                <span class="avg-gearscore">⚡ ${time.avgGearScore} GS</span>
                            </div>
                        </div>
                        <div class="player-count-badge">
                            ${time.count} Player${time.count > 1 ? 's' : ''}
                        </div>
                    </div>
                    ${classCompositionHTML}
                    <h4 style="margin: 20px 0 10px 0; color: var(--text-primary);">Available Players:</h4>
                    ${playersHTML}
                `;
                
                container.appendChild(card);
            });
        }

        function renderTimelineView() {
            const container = document.getElementById('timelineView');
            const players = loadPlayers();
            const playerNames = Object.keys(players);

            if (playerNames.length === 0) {
                container.innerHTML = '<div class="no-results">No players registered yet.</div>';
                return;
            }

            // Count availability
            const counts = {};
            DAYS.forEach(day => {
                counts[day] = new Array(24).fill(0);
            });

            playerNames.forEach(name => {
                const player = players[name];
                Object.keys(player.availability).forEach(day => {
                    player.availability[day].forEach(hour => {
                        counts[day][hour]++;
                    });
                });
            });

            // Build timeline grid - reorganized by local time
            let html = '<h3 style="margin-bottom: 15px;">Weekly Availability Heatmap (Your Local Time)</h3>';
            html += '<div class="timeline-grid">';
            
            // Create a map from local hours to server hours and counts
            const localTimeCounts = {};
            DAYS.forEach(day => {
                localTimeCounts[day] = {};
                for (let localHour = 0; localHour < 24; localHour++) {
                    localTimeCounts[day][localHour] = 0;
                }
            });

            // Populate counts based on local time
            Object.keys(players).forEach(name => {
                const player = players[name];
                Object.keys(player.availability).forEach(day => {
                    player.availability[day].forEach(serverHour => {
                        const localHour = getLocalHourFromServerHour(serverHour);
                        localTimeCounts[day][localHour]++;
                    });
                });
            });
            
            // Header row
            html += '<div class="timeline-header">Day / Hour</div>';
            for (let hour = 0; hour < 24; hour++) {
                html += `<div class="timeline-header">${String(hour).padStart(2, '0')}</div>`;
            }

            // Data rows
            DAYS.forEach(day => {
                html += `<div class="timeline-day">${day}</div>`;
                for (let localHour = 0; localHour < 24; localHour++) {
                    const count = localTimeCounts[day][localHour];
                    let cellClass = 'count-0';
                    if (count === 1) cellClass = 'count-1';
                    else if (count === 2) cellClass = 'count-2';
                    else if (count === 3) cellClass = 'count-3';
                    else if (count >= 4) cellClass = 'count-4plus';
                    
                    html += `<div class="timeline-cell ${cellClass}" 
                        onclick="showTimelineDetails('${day}', ${localHour}, ${count})"
                        title="${day} ${String(localHour).padStart(2, '0')}:00 - ${count} players (click for details)">${count || '-'}</div>`;
                }
            });

            html += '</div>';
            html += '<div style="margin-top: 20px; padding: 15px; background: var(--bg-secondary); border-radius: 8px; color: var(--text-primary);">';
            html += '<strong>Legend:</strong> ';
            html += '<span style="background: #fff3cd; color: #000; padding: 5px 10px; margin: 0 5px; border-radius: 3px;">1 player</span>';
            html += '<span style="background: #d4edda; color: #000; padding: 5px 10px; margin: 0 5px; border-radius: 3px;">2 players</span>';
            html += '<span style="background: #cfe2ff; color: #000; padding: 5px 10px; margin: 0 5px; border-radius: 3px;">3 players</span>';
            html += '<span style="background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%); color: white; padding: 5px 10px; margin: 0 5px; border-radius: 3px;">4+ players</span>';
            html += '</div>';

            container.innerHTML = html;
        }

        function showTimelineDetails(day, localHour, count) {
            if (count === 0) {
                return; // Don't show popup for empty cells
            }

            const players = loadPlayers();
            const availablePlayers = [];

            // Find players available at this time
            Object.keys(players).forEach(name => {
                const player = players[name];
                if (player.availability[day]) {
                    player.availability[day].forEach(serverHour => {
                        const playerLocalHour = getLocalHourFromServerHour(serverHour);
                        if (playerLocalHour === localHour) {
                            availablePlayers.push(player);
                        }
                    });
                }
            });

            // Remove duplicates
            const uniquePlayers = Array.from(new Set(availablePlayers.map(p => p.name)))
                .map(name => availablePlayers.find(p => p.name === name));

            // Calculate average gearscore
            const avgGS = uniquePlayers.length > 0 
                ? Math.round(uniquePlayers.reduce((sum, p) => sum + p.gearScore, 0) / uniquePlayers.length)
                : 0;

            // Build player list HTML
            let playersHTML = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 15px;">';
            uniquePlayers.forEach(player => {
                playersHTML += `
                    <div style="background: var(--bg-secondary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <div style="font-weight: bold; color: var(--text-primary); margin-bottom: 5px;">${player.name}</div>
                        <div style="font-size: 0.85em; color: var(--text-secondary);">
                            ${player.class}<br>
                            GS: ${player.gearScore}
                        </div>
                    </div>
                `;
            });
            playersHTML += '</div>';

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-popup">
                    <button class="modal-close-btn" onclick="this.closest('.modal-overlay').remove()">×</button>
                    <h3 style="color: var(--text-primary); margin-bottom: 20px;">
                        ${day} at ${String(localHour).padStart(2, '0')}:00
                    </h3>
                    
                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <div style="background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); 
                                    color: white; padding: 15px 20px; border-radius: 10px; text-align: center; flex: 1;">
                            <div style="font-size: 2em; font-weight: bold;">${count}</div>
                            <div style="font-size: 0.9em;">Players Available</div>
                        </div>
                        <div style="background: var(--bg-secondary); color: var(--text-primary); 
                                    padding: 15px 20px; border-radius: 10px; text-align: center; flex: 1; border: 2px solid var(--border-color);">
                            <div style="font-size: 2em; font-weight: bold;">${avgGS}</div>
                            <div style="font-size: 0.9em;">Avg Gearscore</div>
                        </div>
                    </div>

                    <h4 style="color: var(--text-primary); margin-bottom: 10px;">Available Players:</h4>
                    ${playersHTML}
                </div>
            `;

            document.body.appendChild(modal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }

        function resetFilters() {
            document.getElementById('minPlayers').value = 2;
            document.getElementById('filterDay').value = '';
            document.getElementById('minGearScore').value = 0;
            document.getElementById('timeRange').value = 'all';
            findRaidTimes();
        }

        // Timezone popup
        function showTimezonePopup() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-popup">
                    <button class="modal-close-btn" onclick="this.closest('.modal-overlay').remove()">×</button>
                    <h3>🌍 Timezone Settings</h3>
                    
                    <div class="time-display-popup">
                        <div style="margin-bottom: 10px; color: var(--text-secondary);">Current Time</div>
                        <div class="time" id="popupLocalTime">--:--:--</div>
                        <div style="margin-top: 5px; color: var(--text-secondary);">
                            <span id="popupTimezoneLabel">Loading...</span>
                        </div>
                        <div style="margin-top: 10px; font-size: 0.9em; color: var(--text-secondary);">
                            Server Time: <strong id="popupServerTime">--:--:--</strong>
                        </div>
                        <div style="margin-top: 5px; font-size: 0.85em; color: var(--text-tertiary);" id="popupDstIndicator">
                            Detecting season...
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="popupTimezoneSelect">Select Timezone:</label>
                        <select id="popupTimezoneSelect" class="form-control">
                            <option value="auto">Auto-detect (${Intl.DateTimeFormat().resolvedOptions().timeZone})</option>
                            <optgroup label="Americas">
                                <option value="America/New_York">New York (EST/EDT)</option>
                                <option value="America/Chicago">Chicago (CST/CDT)</option>
                                <option value="America/Denver">Denver (MST/MDT)</option>
                                <option value="America/Los_Angeles">Los Angeles (PST/PDT)</option>
                                <option value="America/Phoenix">Phoenix (MST)</option>
                                <option value="America/Anchorage">Anchorage (AKST)</option>
                                <option value="America/Toronto">Toronto (EST/EDT)</option>
                                <option value="America/Vancouver">Vancouver (PST/PDT)</option>
                                <option value="America/Mexico_City">Mexico City (CST)</option>
                                <option value="America/Sao_Paulo">São Paulo (BRT)</option>
                                <option value="America/Argentina/Buenos_Aires">Buenos Aires (ART)</option>
                            </optgroup>
                            <optgroup label="Europe">
                                <option value="Europe/London">London (GMT/BST)</option>
                                <option value="Europe/Paris">Paris (CET/CEST)</option>
                                <option value="Europe/Berlin">Berlin (CET/CEST)</option>
                                <option value="Europe/Madrid">Madrid (CET/CEST)</option>
                                <option value="Europe/Rome">Rome (CET/CEST)</option>
                                <option value="Europe/Amsterdam">Amsterdam (CET/CEST)</option>
                                <option value="Europe/Brussels">Brussels (CET/CEST)</option>
                                <option value="Europe/Vienna">Vienna (CET/CEST)</option>
                                <option value="Europe/Stockholm">Stockholm (CET/CEST)</option>
                                <option value="Europe/Warsaw">Warsaw (CET/CEST)</option>
                                <option value="Europe/Athens">Athens (EET/EEST)</option>
                                <option value="Europe/Istanbul">Istanbul (TRT)</option>
                                <option value="Europe/Moscow">Moscow (MSK)</option>
                            </optgroup>
                            <optgroup label="Asia">
                                <option value="Asia/Dubai">Dubai (GST)</option>
                                <option value="Asia/Kolkata">Mumbai (IST)</option>
                                <option value="Asia/Bangkok">Bangkok (ICT)</option>
                                <option value="Asia/Singapore">Singapore (SGT)</option>
                                <option value="Asia/Jakarta">Jakarta (WIB)</option>
                                <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
                                <option value="Asia/Shanghai">Shanghai (CST)</option>
                                <option value="Asia/Taipei">Taipei (CST)</option>
                                <option value="Asia/Manila">Manila (PHT)</option>
                                <option value="Asia/Tokyo">Tokyo (JST)</option>
                                <option value="Asia/Seoul">Seoul (KST)</option>
                            </optgroup>
                            <optgroup label="Oceania">
                                <option value="Australia/Perth">Perth (AWST)</option>
                                <option value="Australia/Sydney">Sydney (AEDT/AEST)</option>
                                <option value="Australia/Melbourne">Melbourne (AEDT/AEST)</option>
                                <option value="Pacific/Auckland">Auckland (NZST)</option>
                                <option value="Pacific/Fiji">Fiji (FJT)</option>
                                <option value="Pacific/Honolulu">Honolulu (HST)</option>
                            </optgroup>
                            <optgroup label="Africa">
                                <option value="Africa/Cairo">Cairo (EET)</option>
                                <option value="Africa/Johannesburg">Johannesburg (SAST)</option>
                                <option value="Africa/Lagos">Lagos (WAT)</option>
                            </optgroup>
                        </select>
                    </div>
                    
                    <h4 style="margin-top: 25px; margin-bottom: 15px; color: var(--text-primary);">Conversion Examples:</h4>
                    <div class="conversion-grid" id="popupConversions"></div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            const timezoneSelect = document.getElementById('popupTimezoneSelect');
            timezoneSelect.value = selectedTimezone;
            
            updatePopupTimes();
            const interval = setInterval(updatePopupTimes, 1000);
            
            timezoneSelect.addEventListener('change', () => {
                selectedTimezone = timezoneSelect.value;
                localStorage.setItem('selectedTimezone', selectedTimezone);
                updatePopupTimes();
                
                // Re-render the current view
                if (currentView === 'list') {
                    findRaidTimes();
                } else {
                    renderTimelineView();
                }
            });
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    clearInterval(interval);
                    modal.remove();
                }
            });
        }

        function updatePopupTimes() {
            const now = new Date();
            
            // Display time in selected timezone
            let timeString;
            if (selectedTimezone === 'auto') {
                timeString = now.toLocaleTimeString('en-US', { hour12: false });
            } else {
                timeString = now.toLocaleTimeString('en-US', { 
                    timeZone: selectedTimezone,
                    hour12: false 
                });
            }
            
            const serverTime = new Date(now.getTime() - (isSummerTime() ? 2 : 1) * 60 * 60 * 1000 + 9 * 60 * 60 * 1000);
            const serverHour = serverTime.getUTCHours();
            const serverMin = serverTime.getUTCMinutes();
            const serverSec = serverTime.getUTCSeconds();
            const serverTimeString = `${String(serverHour).padStart(2, '0')}:${String(serverMin).padStart(2, '0')}:${String(serverSec).padStart(2, '0')}`;
            
            document.getElementById('popupLocalTime').textContent = timeString;
            document.getElementById('popupServerTime').textContent = serverTimeString;
            
            const tzLabel = selectedTimezone === 'auto' ? 
                Intl.DateTimeFormat().resolvedOptions().timeZone : 
                selectedTimezone;
            document.getElementById('popupTimezoneLabel').textContent = tzLabel;
            
            const dstIndicator = isSummerTime() ? 
                '☀️ Currently using Summer Time (DST)' : 
                '❄️ Currently using Winter Time (Standard Time)';
            document.getElementById('popupDstIndicator').textContent = dstIndicator;
            
            // Update conversion examples
            const conversionsDiv = document.getElementById('popupConversions');
            if (conversionsDiv) {
                let html = '';
                for (let i = 0; i < 24; i += 3) {
                    const localHour = getLocalHourFromServerHour(i);
                    html += `
                        <div class="conversion-item">
                            <div class="conversion-item-local">${String(localHour).padStart(2, '0')}:00</div>
                            <div class="conversion-item-server">Server: ${String(i).padStart(2, '0')}:00</div>
                        </div>
                    `;
                }
                conversionsDiv.innerHTML = html;
            }
        }

        // Dark mode toggle (default is dark)
        function toggleDarkMode() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('lightMode', isLight);
            document.querySelector('.dark-mode-toggle').textContent = isLight ? '🌙' : '☀️';
        }

        // Load timezone preference FIRST
        if (localStorage.getItem('selectedTimezone')) {
            selectedTimezone = localStorage.getItem('selectedTimezone');
        }

        // Load theme preference (default to dark mode)
        if (localStorage.getItem('lightMode') === 'true') {
            document.body.classList.add('light-mode');
            document.querySelector('.dark-mode-toggle').textContent = '🌙';
        } else {
            document.querySelector('.dark-mode-toggle').textContent = '☀️';
        }

        // Initialize - load from server
        loadFromServer();
    </script>
</body>
